plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-factory_bot

# require:
#   - ./rubocop/use_from_email.rb
#   - ./rubocop/custom_cop_location.rb

Layout/LineLength:
  Max: 150

Layout/EndOfLine:
  Enabled: false

RSpec/ExampleLength:
  Max: 50

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

Naming/FileName:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/OpenStructUse:
  Enabled: false

Starchats/AttachmentDownload:
  Enabled: true
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Style/OptionalBooleanParameter:
  Exclude:
    - 'app/services/email_templates/db_resolver_service.rb'
    - 'app/dispatchers/dispatcher.rb'

Style/GlobalVars:
  Exclude:
    - 'config/initializers/01_redis.rb'
    - 'config/initializers/rack_attack.rb'
    - 'lib/redis/alfred.rb'
    - 'lib/global_config.rb'
    - 'spec/**/*' # Allow global vars in tests/mocks if needed

Style/ClassVars:
  Exclude:
    - 'app/services/email_templates/db_resolver_service.rb'

Lint/MissingSuper:
  Exclude:
    - 'app/drops/base_drop.rb'
    - 'app/services/evolution/message_base_service.rb'

Lint/SymbolConversion:
  Enabled: false

Lint/EmptyBlock:
  Exclude:
    - 'app/views/api/v1/accounts/conversations/toggle_status.json.jbuilder'

Lint/OrAssignmentToConstant:
  Exclude:
    - 'lib/redis/config.rb'

Rails/HelperInstanceVariable:
  Exclude:
    - starchat/app/helpers/cosmos/chat_helper.rb

Rails/ApplicationController:
  Exclude:
    - 'app/controllers/api/v1/widget/messages_controller.rb'
    - 'app/controllers/dashboard_controller.rb'
    - 'app/controllers/widget_tests_controller.rb'
    - 'app/controllers/widgets_controller.rb'
    - 'app/controllers/platform_controller.rb'
    - 'app/controllers/public_controller.rb'
    - 'app/controllers/survey/responses_controller.rb'

Rails/FindEach:
  Enabled: true
  Include:
    - 'app/**/*.rb'

Rails/CompactBlank:
  Enabled: false

Rails/EnvironmentVariableAccess:
  Enabled: false

Rails/TimeZoneAssignment:
  Enabled: false

Rails/RedundantPresenceValidationOnBelongsTo:
  Enabled: false

Rails/InverseOf:
  Exclude:
    - starchat/app/models/cosmos/assistant.rb

Rails/UniqueValidationWithoutIndex:
  Exclude:
    - app/models/canned_response.rb
    - app/models/telegram_bot.rb
    - starchat/app/models/cosmos_inbox.rb
    - 'app/models/channel/twitter_profile.rb'
    - 'app/models/webhook.rb'
    - 'app/models/contact.rb'

Style/MapToHash:
  Enabled: false

Style/HashSyntax:
  Enabled: true
  EnforcedStyle: no_mixed_keys
  EnforcedShorthandSyntax: never

RSpec/NestedGroups:
  Enabled: true
  Max: 10

RSpec/MessageSpies:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Naming/MemoizedInstanceVariableName:
  Exclude:
    - 'app/models/message.rb'
    - 'app/controllers/api/v1/accounts/channels/evolution_channel_controller.rb'

Style/GuardClause:
  Exclude:
    - 'app/builders/account_builder.rb'
    - 'app/models/attachment.rb'
    - 'app/models/message.rb'

Rails/RenderInline:
  Exclude:
    - 'app/controllers/swagger_controller.rb'

Rails/ThreeStateBooleanColumn:
  Exclude:
    - 'db/migrate/20230503101201_create_sla_policies.rb'

RSpec/IndexedLet:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 20

RSpec/MultipleMemoizedHelpers:
  Max: 20

Style/OneClassPerFile:
  Enabled: true

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'public/**/*'
    - 'config/initializers/bot.rb'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'lib/tasks/auto_annotate_models.rake'
    - 'config/environments/**/*'
    - 'tmp/**/*'
    - 'storage/**/*'
    - 'db/migrate/20230426130150_init_schema.rb'

FactoryBot/SyntaxMethods:
  Enabled: false

Layout/LeadingCommentSpace:
  Enabled: false

Style/ReturnNilInPredicateMethodDefinition:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Performance/StringIdentifierArgument:
  Enabled: false

Layout/EmptyLinesAroundExceptionHandlingKeywords:
  Enabled: false

Lint/LiteralAsCondition:
  Enabled: false

Style/RedundantReturn:
  Enabled: false

Layout/SpaceAroundOperators:
  Enabled: false

Rails/EnvLocal:
  Enabled: false

Rails/WhereRange:
  Enabled: false

Lint/UselessConstantScoping:
  Enabled: false

Style/MultipleComparison:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false

RSpec/ExampleWording:
  Enabled: false

RSpec/ReceiveMessages:
  Enabled: false

FactoryBot/AssociationStyle:
  Enabled: false

Rails/EnumSyntax:
  Enabled: false

Lint/RedundantTypeConversion:
  Enabled: false

Rails/RedundantActiveRecordAllMethod:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: true

Style/SafeNavigationChainLength:
  Enabled: false

Lint/SafeNavigationConsistency:
  Enabled: false

Lint/CopDirectiveSyntax:
  Enabled: false

FactoryBot/ExcessiveCreateList:
  Enabled: false

RSpec/MissingExpectationTargetMethod:
  Enabled: false

Performance/InefficientHashSearch:
  Enabled: false

Style/RedundantSelfAssignmentBranch:
  Enabled: false

Style/YAMLFileRead:
  Enabled: false

Layout/ExtraSpacing:
  Enabled: false

Style/RedundantFilterChain:
  Enabled: false

Performance/MapMethodChain:
  Enabled: false

Rails/RootPathnameMethods:
  Enabled: false

Style/SuperArguments:
  Enabled: false

Rails/Delegate:
  Enabled: false

Style/CaseLikeIf:
  Enabled: false

FactoryBot/RedundantFactoryOption:
  Enabled: false

FactoryBot/FactoryAssociationWithStrategy:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/EmptyExampleGroup:
  Enabled: false

Lint/DuplicateMethods:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

# OVERRIDE: Final suppressions for legacy codebase (Method names, unused args, etc)
Naming/MethodParameterName:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Lint/SuppressedException:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Lint/EmptyConditionalBody:
  Enabled: false

Style/ExponentialNotation:
  Enabled: false

Lint/UselessRescue:
  Enabled: false

Layout/LineLength:
  Max: 300

Style/GlobalVars:
  Enabled: false

Rails/RenderInline:
  Enabled: false

Rails/TransactionExitStatement:
  Enabled: false
