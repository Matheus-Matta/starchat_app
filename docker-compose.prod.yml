version: "3.8"

services:
  base: &base
    image: ${APP_IMAGE}
    env_file: .env
    volumes:
      - ./.env:/app/.env
      - ./rails.sh:/app/docker/entrypoints/rails.sh
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - apps_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-chatwoot}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"

  rails:
    <<: *base
    entrypoint: ["/app/docker/entrypoints/rails.sh"]
    command: ["bundle","exec","puma","-C","config/puma.rb"]
    ports:
      - "3000:3000"
    stop_grace_period: 60s

  sidekiq_critical:
    <<: *base
    command: ["bundle","exec","sidekiq","-c","5",
              "-q","critical,8",
              "-q","high,10"]
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.0"
        reservations:
          memory: 768m

  sidekiq_realtime:
    <<: *base
    command: ["bundle","exec","sidekiq","-c","4",
              "-q","medium,8",
              "-q","mailers,3"]
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          memory: 1280m
          cpus: "1.0"
        reservations:
          memory: 640m

  sidekiq_background:
    <<: *base
    command: ["bundle","exec","sidekiq","-c","3",
              "-q","low,8",
              "-q","deferred,2",
              "-q","purgable,2"]
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          memory: 1280m
          cpus: "0.8"
        reservations:
          memory: 640m

  sidekiq_scheduled:
    <<: *base
    command: ["bundle","exec","sidekiq","-c","2",
              "-q","scheduled_jobs,5",
              "-q","housekeeping,3"]
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"
        reservations:
          memory: 256m

  sidekiq_migrations:
    <<: *base
    command: ["bundle","exec","sidekiq","-c","1",
              "-q","async_database_migration,4"]
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.3"
        reservations:
          memory: 128m

  sidekiq_evolution:
    <<: *base
    command: ["bundle","exec","sidekiq","-c","2",
              "-q","evolution,5"]
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"
        reservations:
          memory: 256m

  sidekiq_default:
    <<: *base
    command: ["bundle","exec","sidekiq","-c","2",
              "-q","default,10"]
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"
        reservations:
          memory: 256m

  evolution_consumer:
    <<: *base
    command: ["bundle", "exec", "rake", "evolution:rabbitmq"]
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 256m

networks:
  apps_net:
    external: true
