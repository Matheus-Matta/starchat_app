services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file: .env.teste
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USERNAME:-postgres} -d $${POSTGRES_DB:-postgres} || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  redis:
    image: redis:alpine
    restart: always
    env_file: .env.teste
    command:
      [
        'sh',
        '-c',
        'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"',
      ]
    volumes:
      - redis_data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'PING']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  base: &base
    image: ghcr.io/matheus-matta/starchat_app:v1.0.0-star
    env_file: .env.teste
    volumes:
      - storage_data:/app/storage
    networks:
      - app_network

  rails:
    <<: *base
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chatwoot}
      - DB_USER=${POSTGRES_USERNAME}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    ports:
      - '3000:3000'
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    <<: *base
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chatwoot}
      - DB_USER=${POSTGRES_USERNAME}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  storage_data:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge