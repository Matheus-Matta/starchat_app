version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - app_network

  redis:
    image: redis:latest
    restart: always
    command:
      [
        'sh',
        '-c',
        'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"',
      ]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - app_network

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '8080:8080'
    env_file:
      - .env.evolution
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - app_network
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  redis_data:
  evolution_data:

networks:
  app_network:
    driver: bridge
